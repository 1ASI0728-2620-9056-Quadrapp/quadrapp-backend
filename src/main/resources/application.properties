spring.application.name=quadrapp-backend
server.port=8080

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quadrapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Validate database structure without creating or altering tables
spring.jpa.hibernate.ddl-auto=validate

# Database dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Open Session in View
spring.jpa.open-in-view=false

# SQL logging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.com.upc.quadrapp=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
