spring.application.name=quadrapp-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quadrapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created only by Flyway migrations (db/migration/<schema>).
# Hibernate validates the JPA mappings against the migrated schema and never changes it.
spring.jpa.hibernate.ddl-auto=validate

# Each bounded context runs its own Flyway migration in its own schema
# (see ModuleSchemaMigrations), so the single default Flyway is disabled.
spring.flyway.enabled=false

# Spring Modulith event publication registry (transactional outbox).
# The table is created by Flyway in the shared schema (db/migration/shared), never by Modulith.
# Publications still incomplete when the application stops are published again on restart;
# consumers drop duplicates by eventId.
spring.modulith.events.jdbc.schema=shared
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true

# Disable Open Session in View
spring.jpa.open-in-view=false

# SQL configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secret used to sign JWT access tokens (Base64)
quadrapp.security.jwt.secret-base64=${JWT_SECRET_BASE64}

# JWT issuer
quadrapp.security.jwt.issuer=quadrapp

# Access token expiration: 15 minutes
quadrapp.security.jwt.access-expiration-seconds=900

# Secret for OTP, invitation and refresh-token hashing
quadrapp.security.hash-pepper-base64=${OTP_HASH_PEPPER_BASE64}

# OTP expiration: 5 minutes
quadrapp.iam.otp-expiration-minutes=5

# Access code requests allowed per email in a sliding window (CON-09: 429 above the limit)
quadrapp.iam.otp-max-requests=5
quadrapp.iam.otp-request-window-minutes=15

# Invitation expiration: 48 hours
quadrapp.iam.invitation-expiration-hours=48

# Invitation acceptance URL
quadrapp.iam.invitation-url-base=${INVITATION_URL_BASE:http://localhost:4200/accept-invitation}

# Refresh token expiration: 7 days
quadrapp.iam.refresh-expiration-days=7

# Sender address
quadrapp.mail.from=${MAIL_FROM:no-reply@quadrapp.test}


# SMTP server - Mailpit (local development)
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}

# Optional SMTP credentials
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP security - Mailpit
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# SMTP timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.root=INFO
logging.level.com.upc.quadrapp=DEBUG

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
