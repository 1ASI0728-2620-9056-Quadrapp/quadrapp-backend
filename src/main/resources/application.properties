spring.application.name=quadrapp-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quadrapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically create/update tables from JPA entities
# Development only
spring.jpa.hibernate.ddl-auto=update

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Open Session in View
spring.jpa.open-in-view=false

# SQL configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secret used to sign JWT access tokens (Base64)
quadrapp.security.jwt.secret-base64=${JWT_SECRET_BASE64}

# JWT issuer
quadrapp.security.jwt.issuer=quadrapp

# Access token expiration: 15 minutes
quadrapp.security.jwt.access-expiration-seconds=900

# Secret for OTP, invitation and refresh-token hashing
quadrapp.security.hash-pepper-base64=${OTP_HASH_PEPPER_BASE64}

# OTP expiration: 5 minutes
quadrapp.iam.otp-expiration-minutes=5

# Invitation expiration: 48 hours
quadrapp.iam.invitation-expiration-hours=48

# Invitation acceptance URL
quadrapp.iam.invitation-url-base=${INVITATION_URL_BASE:http://localhost:4200/accept-invitation}

# Refresh token expiration: 7 days
quadrapp.iam.refresh-expiration-days=7

# Sender address
quadrapp.mail.from=${MAIL_FROM:no-reply@quadrapp.test}

# SMTP server
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# Optional SMTP credentials
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.root=INFO
logging.level.com.upc.quadrapp=DEBUG

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
