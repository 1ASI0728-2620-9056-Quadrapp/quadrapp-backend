# Runs the test suite, publishes the backend image to GitHub Container Registry and, on main,
# deploys it to the EC2 instance (decision D7b: GitHub Actions -> GHCR -> EC2).
# See deploy/README.md, "Automatic deploy".
name: backend-image

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/1asi0728-2620-9056-quadrapp/quadrapp-backend

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress test

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU runs the few runtime-stage steps of the arm64 image; the jar itself is built
      # natively on the runner (Dockerfile build stage uses $BUILDPLATFORM).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<7 chars> for every build, the branch name (develop, main) and the git tag.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      # Multi-platform image: linux/arm64 for the EC2 instance (t4g.small, AWS Graviton) and
      # linux/amd64 for x86_64 machines such as developer laptops.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the image of this commit to the EC2 instance, only from main. GitHub's OIDC token is
  # exchanged for the AWS role quadrapp-github-deploy (no stored keys); its trust policy only
  # accepts this repository on refs/heads/main and it may only run AWS-RunShellScript on the
  # instance. deploy/scripts/deploy.sh rolls back to the previous image when the new one does
  # not answer, and this job then fails.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-03624d1e88daaf69b
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::703354833657:role/quadrapp-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through SSM
        run: |
          tag="sha-${GITHUB_SHA::7}"
          # The lock covers the checkout too, so an older SSM command (from a cancelled run)
          # never has its files changed under it. Only the current tip of main is deployed:
          # an older commit that gets the lock later is skipped, its newer run deploys.
          params=$(jq -n --arg sha "$GITHUB_SHA" --arg tag "$tag" '{commands: [
            "set -eu",
            "exec 9>/tmp/quadrapp-deploy.lock",
            "flock -w 900 9",
            "cd /home/ubuntu/quadrapp-backend",
            "sudo -u ubuntu git fetch --quiet --depth 1 origin main",
            "tip=$(sudo -u ubuntu git rev-parse FETCH_HEAD)",
            "if [ \"$tip\" != \"\($sha)\" ]; then echo \"main is now at $tip; skipping \($sha).\"; exit 0; fi",
            "sudo -u ubuntu git checkout --quiet --force \($sha)",
            "QUADRAPP_DEPLOY_LOCK_HELD=1 bash deploy/scripts/deploy.sh \($tag)"
          ]}')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $tag" --timeout-seconds 900 \
            --parameters "$params" --query Command.CommandId --output text)
          echo "SSM command $command_id deploys $tag."
          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          if [ "$status" != "Success" ]; then
            echo "::error::Deploy of $tag ended with status $status; see the output above."
            exit 1
          fi
