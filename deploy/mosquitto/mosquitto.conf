# Mosquitto 2 broker of the Quadrapp prototype (decisions D7a and D7b).
# No anonymous access: every client authenticates with the dynamic security plugin.
allow_anonymous false

# Durable sessions and queues (D7a point 4). The SQLite persistence plugin writes every
# change to /mosquitto/data as it happens, so a broker crash does not lose acknowledged
# QoS 1 messages. It replaces the built-in snapshot (`persistence true`, which only saves
# every `autosave_interval` seconds and cannot be combined with a persistence plugin).
# plugin_opt_flush_period is how often, in seconds, pending writes are committed.
global_plugin /usr/lib/mosquitto_persist_sqlite.so
plugin_opt_db_file /mosquitto/data/mosquitto.sqlite3
plugin_opt_sync normal
plugin_opt_flush_period 0

# Queue limits (D7a point 5). The default is 1,000 messages per client; the backend session
# must hold the readings of every gateway while it is down or redeploying.
max_queued_messages 100000
max_queued_bytes 0
# A persistent session that does not reconnect within 7 days is removed.
persistent_client_expiration 7d

# Credentials and ACLs (D7a point 8): one client per gateway that can only publish to
# quadrapp/<tenantId>/<gatewayId>/#, and a backend client that can only subscribe.
# The file is created by deploy/scripts/init-mqtt.sh and edited with mosquitto_ctrl.
global_plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Plain MQTT, reachable only inside the Docker network (backend and mosquitto_ctrl).
# docker-compose.yml does not publish this port.
listener 1883

# MQTT over TLS for the gateways, published on the host as 8883.
# The certificate is the one Caddy obtains for MQTT_DOMAIN, copied by
# deploy/mosquitto/start.sh at start (and refreshed by deploy/scripts/renew-mqtt-cert.sh).
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
